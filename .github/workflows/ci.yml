# The real gate. The `pre-commit` hook runs the same `pnpm check`, but a hook is
# a convenience and `git commit --no-verify` walks straight past it. This does
# not walk past.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          # commitlint needs the range of commits the PR actually adds.
          # gitleaks scans the full history, not just the working tree.
          fetch-depth: 0

      # Secret scanning across the whole git history. Runs before any install:
      # a leaked credential should fail fast, and gitleaks needs the checkout
      # alone. Using the official action rather than a raw download pins the
      # version and feeds results back into the Actions UI.
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lockfile vulnerability scan. osv-scanner reads pnpm-lock.yaml directly,
      # so it needs no install and covers transitive deps that `minimumReleaseAge`
      # cannot see.
      - name: Scan dependencies for vulnerabilities
        uses: google/osv-scanner-action@v2
        with:
          fail-on-vuln: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Scripts stay off, for the same reason they are off locally: a
      # dependency's install script is arbitrary code, and in CI it runs with
      # whatever the job's token can reach.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
