version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches `minimumReleaseAge` in pnpm-workspace.yaml. Without it Dependabot
    # proposes a release the installer will then refuse, and every such PR is
    # red for a month.
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
